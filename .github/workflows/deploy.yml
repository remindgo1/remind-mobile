name: Phase 1 DEV and TEST deployment

on:
  push:
    branches: [dev, test]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test]

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify backend
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify mobile app
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

  backend:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}

    env:
      ACR_NAME: remindregistrydev
      ACR_LOGIN_SERVER: remindregistrydev.azurecr.io
      IMAGE_NAME: remind-api
      DEPLOY_ENV: ${{ github.event.inputs.environment || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build backend Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:$DEPLOY_ENV-${GITHUB_SHA}" \
            ./backend

      - name: Push backend Docker image
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:$DEPLOY_ENV-${GITHUB_SHA}"

      - name: Display published image
        run: |
          echo "Successfully pushed:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:$DEPLOY_ENV-${GITHUB_SHA}"

  mobile:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build internal DEV or TEST app
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}

        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile "${{ (github.event.inputs.environment || github.ref_name) == 'dev' && 'development' || 'preview' }}" \
            --non-interactive \
            --no-wait
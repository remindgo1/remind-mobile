services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: remind
      POSTGRES_USER: remind
      POSTGRES_PASSWORD: remind-dev-only
    ports:
      - "5432:5432"
    volumes:
      - remind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remind -d remind"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  remind_pgdata:
